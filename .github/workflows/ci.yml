name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-placeholder-not-a-production-secret
      NEXT_PUBLIC_SITE_URL: https://shop.example.test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report high-severity dependencies (known Prisma tooling debt)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Block critical dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and Caddy
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production config --quiet
          docker run --rm -e SITE_DOMAIN=shop.example.test -e ACME_EMAIL=owner@example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build container without production secrets
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://shop.example.test -t mpj-ci .
      - name: Verify migrations, health and persistent image permissions
        run: |
          docker run -d --name mpj-ci -p 127.0.0.1:3000:3000 -v mpj-ci-db:/data -v mpj-ci-uploads:/app/public/uploads -e DATABASE_URL=file:/data/shop.db -e AUTH_SECRET=ci-only-placeholder-not-a-production-secret -e AUTH_URL=https://shop.example.test -e NEXT_PUBLIC_SITE_URL=https://shop.example.test mpj-ci
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health
          docker exec mpj-ci node -e "require('fs').writeFileSync('/app/public/uploads/ci-check.txt', 'persistent')"
          docker restart mpj-ci
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health
          docker exec mpj-ci node -e "if(require('fs').readFileSync('/app/public/uploads/ci-check.txt','utf8')!=='persistent')process.exit(1)"
      - name: Container logs
        if: always()
        run: docker logs mpj-ci || true