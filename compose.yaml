name: ma-petite-jacqueline
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
    restart: unless-stopped
    init: true
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/shop.db
      AUTH_URL: https://${SITE_DOMAIN}
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      TRUSTED_IP_HEADER: X-Shop-Client-IP
    volumes:
      - database:/data
      - uploads:/app/public/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  database:
  uploads:
  caddy_data:
  caddy_config: